<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weight map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="weightmap.css">
</head>
<body>
  <div id="wm-root" class="wm">

    <div class="wm-toolbar">
      <label>Fallback threshold (t)
        <input id="wm-threshold" type="number" min="0" step="0.5" value="10">
      </label>
      <label>Warn at (%)
        <input id="wm-warnpct" type="number" min="0" max="100" step="5" value="80">
      </label>
      <label>Show
        <select id="wm-filter">
          <option value="all" selected>All vehicles</option>
          <option value="reporting">Reporting weight only</option>
          <option value="register">In axle register only</option>
          <option value="over">Over limit only</option>
        </select>
      </label>
      <label class="wm-check">
        <input id="wm-autorefresh" type="checkbox" checked> Auto-refresh (60&nbsp;s)
      </label>
      <button id="wm-refresh" class="wm-btn wm-btn-primary">Refresh</button>
      <span id="wm-status" class="wm-status"></span>
    </div>

    <div class="wm-legend">
      <span><i class="dot dot-critical"></i> Over GVM payload (flashing)</span>
      <span><i class="dot dot-over"></i> Over GML payload / threshold (flashing)</span>
      <span><i class="dot dot-warn"></i> Approaching</span>
      <span><i class="dot dot-under"></i> Under</span>
      <span><i class="dot dot-none"></i> No weight data</span>
    </div>

    <div id="wm-map" class="wm-map"></div>

    <div class="wm-panel">
      <h3>Monitored vehicles &mdash; axle scale register</h3>
      <table class="wm-table" id="wm-table">
        <thead>
          <tr>
            <th>Vehicle</th><th>Rego</th><th>Axles</th>
            <th class="num">Tare (t)</th><th class="num">GML (t)</th><th class="num">GVM (t)</th>
            <th class="num">Payload limit (t)</th><th class="num">Current cargo (t)</th>
            <th class="num">% of limit</th><th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="weight-register.js"></script>
  <script src="weightmap.js?v=20260729-2"></script>
</body>
</html>
