<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weight map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="weightmap.css">
</head>
<body>
  <div id="wm-root" class="wm">

    <div class="wm-toolbar">
      <label>Threshold (t)
        <input id="wm-threshold" type="number" min="0" step="0.5" value="10">
      </label>
      <label>Warn at (%)
        <input id="wm-warnpct" type="number" min="0" max="100" step="5" value="80">
      </label>
      <label>Show
        <select id="wm-filter">
          <option value="all" selected>All vehicles</option>
          <option value="reporting">Reporting weight only</option>
          <option value="over">Over threshold only</option>
        </select>
      </label>
      <label class="wm-check">
        <input id="wm-autorefresh" type="checkbox" checked> Auto-refresh (60&nbsp;s)
      </label>
      <button id="wm-refresh" class="wm-btn wm-btn-primary">Refresh</button>
      <span id="wm-status" class="wm-status"></span>
    </div>

    <div class="wm-legend">
      <span><i class="dot dot-over"></i> Over threshold</span>
      <span><i class="dot dot-warn"></i> Approaching</span>
      <span><i class="dot dot-under"></i> Under</span>
      <span><i class="dot dot-none"></i> No weight data</span>
    </div>

    <div id="wm-map" class="wm-map"></div>

    <div class="wm-panel">
      <h3>Vehicles over threshold</h3>
      <table class="wm-table" id="wm-over-table">
        <thead>
          <tr><th>Vehicle</th><th class="num">Weight (t)</th><th class="num">% of threshold</th><th>Last update</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="weightmap.js"></script>
</body>
</html>
